name: SABI-RAY validation
on:
  push:
    branches: [main, sabi-ray-alpha]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sabi-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Isolated SABI-RAY tests
        run: python -m unittest discover -s tests_sabi -v
      - name: Syntax validation
        run: python -m compileall -q sabi_ray app
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build real branded dashboard and image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sabi-ray:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose configuration validation
        run: |
          printf 'PUBLIC_DOMAIN=panel.example.test\n' > .env
          docker compose -f compose.yaml -f compose.vps.yaml config --quiet
          rm .env
      - name: Install browser testing dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Startup, user, subscription and restart integration test
        run: python tests_sabi/smoke.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabi-ray-browser-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
